<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حكايتنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbe9ee;--bg2:#f6d3dd;--card:#fff8fa;--ink:#5a2a3b;--soft:#9a6577;--rose:#c8456f;--rose2:#e486a3;--line:#efc3d0}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:"Tajawal",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;min-height:100vh;line-height:1.9;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,.script{font-family:"Aref Ruqaa",serif;font-weight:700}
.hidden{display:none!important}

/* ---------- hearts & butterflies ---------- */
#fx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fx{position:absolute;bottom:-60px;left:var(--x);font-size:var(--s);line-height:1;opacity:0;animation:rise var(--t) linear forwards}
.fx.heart{color:var(--rose2)}
.fx .bf{display:inline-block;animation:flap .45s ease-in-out infinite alternate}
@keyframes rise{
  0%{transform:translate(0,0) rotate(-8deg);opacity:0}
  10%{opacity:.75}
  50%{transform:translate(var(--dx),-55vh) rotate(10deg)}
  90%{opacity:.6}
  100%{transform:translate(calc(var(--dx) * -1),-115vh) rotate(-10deg);opacity:0}
}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.55)}}

/* ---------- gate ---------- */
#gate,main{position:relative;z-index:1}
#gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
#gate h1{font-size:2.4rem;color:var(--rose)}
#gate p{color:var(--soft)}
.envelope{position:relative;width:min(300px,78vw);aspect-ratio:3/2;background:var(--rose2);border-radius:6px;box-shadow:0 18px 40px rgba(200,69,111,.28)}
.envelope::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49.5%,rgba(255,255,255,.18) 50%) ,linear-gradient(to bottom left,transparent 49.5%,rgba(255,255,255,.18) 50%);background-size:50% 100%;background-position:left,right;background-repeat:no-repeat;border-radius:6px}
.flap{position:absolute;top:0;left:0;right:0;height:62%;background:#d96f8f;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease}
.seal{position:absolute;top:50%;left:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 4px 10px rgba(0,0,0,.25);z-index:2;transition:opacity .4s}
.envelope.open .flap{transform:rotateX(180deg)}
.envelope.open .seal{opacity:0}
form{display:flex;gap:8px;width:min(340px,86vw)}
input{flex:1;font:inherit;padding:12px 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);text-align:center;direction:ltr}
input:focus-visible,button:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 22px;background:var(--rose);color:#fff;cursor:pointer}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#err{min-height:1.5em;color:var(--rose);font-size:.95rem}

/* ---------- story ---------- */
main{max-width:640px;margin:0 auto;padding:40px 20px 90px}
section{margin-bottom:64px}
h2{font-size:2rem;color:var(--rose);text-align:center;margin-bottom:20px}
.letter{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 26px;box-shadow:0 10px 30px rgba(200,69,111,.12)}
.letter p{margin-bottom:14px;font-size:1.08rem}
.letter .sign{text-align:left;color:var(--rose);margin:18px 0 0;font-size:1.5rem}
.script{font-family:"Aref Ruqaa",serif}

.gallery{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 4px 22px;margin:0 -20px;padding-inline:20px}
.photo{flex:0 0 72%;scroll-snap-align:center;background:#fff;padding:10px 10px 14px;border-radius:6px;box-shadow:0 10px 26px rgba(90,42,59,.2);transform:rotate(var(--r,0deg))}
.photo:nth-child(odd){--r:-2deg}.photo:nth-child(even){--r:2deg}
.photo .frame{aspect-ratio:3/4;background:var(--bg2);border-radius:3px;overflow:hidden;display:grid;place-items:center;text-align:center;color:var(--soft);font-size:.85rem;padding:12px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo figcaption{text-align:center;margin-top:10px;font-family:"Aref Ruqaa",serif;font-size:1.15rem;color:var(--ink)}
.hint{text-align:center;color:var(--soft);font-size:.9rem}

/* ---------- videos ---------- */
.videos{display:grid;gap:20px}
.vid{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 10px 26px rgba(200,69,111,.14)}
.vid video{display:block;width:100%;max-height:72vh;border-radius:10px;background:#2b1219}
.vid .miss{aspect-ratio:9/16;max-height:50vh;margin:0 auto;display:grid;place-items:center;text-align:center;color:var(--soft);font-size:.9rem;background:var(--bg2);border-radius:10px;padding:14px}
.vid figcaption{text-align:center;margin-top:8px;font-family:"Aref Ruqaa",serif;font-size:1.15rem}

.counter{text-align:center}
.since{color:var(--soft);margin-bottom:16px}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 4px}
.cell b{display:block;font-size:2rem;line-height:1.2;color:var(--rose);font-variant-numeric:tabular-nums}
.cell span{font-size:.85rem;color:var(--soft)}
.counter .sub{margin-top:16px;font-family:"Aref Ruqaa",serif;font-size:1.25rem}

.timeline{position:relative;padding-inline-start:34px}
.timeline::before{content:"";position:absolute;inset-block:6px;inset-inline-start:10px;width:2px;background:var(--line)}
.event{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.event::before{content:"";position:absolute;inset-inline-start:-31px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 4px var(--bg)}
.event h3{font-size:1.05rem}
.event time{display:block;color:var(--soft);font-size:.85rem}
.event p{font-size:.98rem;margin-top:2px}

footer{text-align:center;color:var(--soft);padding-bottom:20px}
#music{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:46px;height:46px;padding:0;font-size:20px;box-shadow:0 6px 16px rgba(200,69,111,.4);z-index:5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<div id="fx" aria-hidden="true"></div>

<div id="gate">
  <h1>لينا ♥</h1>
  <div class="envelope" id="env"><div class="flap"></div><div class="seal">♥</div></div>
  <p>اكتب كلمة السر عشان تفتح الرسالة</p>
  <form id="form">
    <input id="pw" type="password" placeholder="كلمة السر" autocomplete="off" aria-label="كلمة السر">
    <button type="submit">افتح</button>
  </form>
  <div id="err" role="alert"></div>
</div>

<main id="story" class="hidden">
  <section>
    <h2>رسالة</h2>
    <div class="letter" id="letter"></div>
  </section>

  <section>
    <h2>صورنا</h2>
    <div class="gallery" id="gallery" tabindex="0" aria-label="معرض الصور"></div>
    <p class="hint">اسحب يمين وشمال عشان تشوف باقي الصور</p>
  </section>

  <section id="videosSection">
    <h2>واحنا مع بعض</h2>
    <div class="videos" id="videos"></div>
  </section>

  <section class="counter">
    <h2>بدايتنا</h2>
    <p class="since" id="since"></p>
    <div class="cells">
      <div class="cell"><b id="d">0</b><span>يوم</span></div>
      <div class="cell"><b id="h">0</b><span>ساعة</span></div>
      <div class="cell"><b id="m">0</b><span>دقيقة</span></div>
      <div class="cell"><b id="s">0</b><span>ثانية</span></div>
    </div>
    <p class="sub" id="years"></p>
  </section>

  <section>
    <h2>مشوارنا</h2>
    <div class="timeline" id="timeline"></div>
  </section>

  <footer class="script" id="foot"></footer>
</main>

<button id="music" class="hidden" aria-label="تشغيل أو إيقاف الموسيقى">♪</button>
<audio id="audio" loop></audio>

<script>
/* ============================================================
   عدّل هنا بس: كلمة السر، التاريخ، الأسماء، الصور، الفيديوهات، والنصوص
   ============================================================ */
const CONFIG = {
  password: "rema",                 // كلمة السر
  startDate: "2022-11-27T00:00:00", // يوم ما اتقابلتوا: 27/11/2022
  he: "هو",                          // اكتب اسمه
  she: "هي",                         // اكتب اسمها
  music: "music.mp3",               // ملف الموسيقى (اختياري) - حطه جنب index.html
  photos: [                          // حط صورك جنب index.html أو في فولدر photos
    { src: "WhatsApp Image 2026-11-16 at 03.25.03 (1).jpeg", caption: "الطفولة" },
    { src: "WhatsApp Image 2026-11-16 at 03.25.03.jpeg", caption: "الطفولة" },
    { src: "WhatsApp Image 2026-11-16 at 04.37.37 (2).jpeg", caption: "قبل ما نتقابل" },
    { src: "WhatsApp Image 2026-11-16 at 05.16.30.jpeg", caption: "قبل ما نتقابل" },
    { src: "WhatsApp Image 2026-11-16 at 04.37.38 (3).jpeg", caption: "يوم الباص" },
    { src: "WhatsApp Image 2026-11-16 at 04.36.46.jpeg", caption: "أول أيامنا" },
    { src: "WhatsApp Image 2026-11-16 at 04.36.46 (1).jpeg", caption: "مع بعض" },
    { src: "WhatsApp Image 2026-11-16 at 04.36.47 (1).jpeg", caption: "مع بعض" },
    { src: "WhatsApp Image 2026-11-16 at 04.36.47 (5).jpeg", caption: "مع بعض" },
    { src: "WhatsApp Image 2026-11-16 at 04.36.47 (4).jpeg", caption: "مع بعض" },
    { src: "WhatsApp Image 2026-11-16 at 04.36.47 (3).jpeg", caption: "مع بعض" },
    { src: "photos/8.jpg", caption: "فرحنا" }
  ],
  videos: [                          // حط الفيديوهات في فولدر اسمه videos (الأفضل mp4)
    { src: "WhatsApp Video 2026-11-15 at 23.28.52.mp4", caption: "واحنا مع بعض" },
    { src: "WhatsApp Video 2026-11-16 at 05.41.18 (1).mp4", caption: "واحنا مع بعض" },
    { src: "WhatsApp Video 2026-11-16 at 05.41.18 (2).mp4", caption: "واحنا مع بعض" },
    { src: "WhatsApp Video 2026-11-16 at 05.41.18.mp4", caption: "واحنا مع بعض" },
    { src: "WhatsApp Video 2026-11-15 at 23.28.52.mp4", caption: "واحنا مع بعض" },
    { src: "WhatsApp Video 2026-11-16 at 05.41.32 (1).mp4", caption: "واحنا مع بعض" },
    { src: "WhatsApp Video 2026-11-16 at 05.41.32 (2).mp4", caption: "واحنا مع بعض" },
    { src: "WhatsApp Video 2026-11-16 at 05.41.32 (3).mp4", caption: "واحنا مع بعض" },
  ],
  letter: [
    "حبيبتي و صحبتي وكل م ليا انا بحبك اوي ي و بموت فيكي كمان عاوز اقول كلام كتير اوي",
    "بس اي كلام ميوصفش حبي ليكي انتي مش مجرد بنت بحبها و في حياتي انتي حباتي كلها اللي اتمنتها من سنين انتي الحلم  ",
    "اللي صحيت عليه ولاقيته قدامي انتي الامان اللي قلبي ارتاح فيه والدفا اللي حس بيه ",
    "وهتفضلي انتي اختياري الاول والاخير هتفضلي فراشتي الجميله القمر وطول م انتي موجودة انا قوي ",
    "ف بعدك الحياه كاطنش ليها ولا طعم ولا لون وانا لو لافيت الدنيا كلها علشان الاقي حد زيك مش هعرف",
    "لمعه عيني لما بشوفك مستحيل تبقي لحد تاني غيرك هتفضل موجودة طول العمر وهفضل شايفك اجمل انسانة ف الكون",
    "وعمري م هتخلي عن قلبي و حياتي ي احلي و احن واجمل فراشة ف الكون بحبك ي ريمتي 🦋❤️"
  ],
  sign: "بحبك دايماً",
  timeline: [
    { title: "كل واحد في دنيته", date: "", text: "طفلين لسه ما يعرفوش إن في حد مستنيهم." },
    { title: "الباص", date: "27 نوفمبر 2022", text: "اول كلمه اتقالت لو سمحتي معاكي شاحن USB" },
    { title: "البداية الحلوة", date: "", text: "حياه هادية وجميله" },
    { title: "الشك والبعد", date: "", text: "اللي عاملني زي الهلهولا بدء يشتغل اكتر من مرة" },
    { title: "الصبر", date: "", text: "اتنين اختاروا يفضلوا ويفهموا ويسامحوا." },
    { title: "مسك الإيد", date: "", text: "والخط اللي كان بينهم اختفى." },
    { title: "الفرح", date: "", text: "ان شاء لله الايام تعدي بسرعة و نوصل للمرحله دي و نعدلها " }
  ],
  footer: "من طفلين ما يعرفوش بعض... لعروسين كتب الله لهم النصيب ان شاء الله"
};
/* ============================================================ */

const $ = id => document.getElementById(id);
const start = new Date(CONFIG.startDate);

// ---------- hearts & butterflies ----------
(function () {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const layer = $("fx");
  const kinds = ["heart", "heart", "butterfly"];
  function spawn() {
    if (document.hidden || layer.childElementCount > 18) return;
    const kind = kinds[Math.floor(Math.random() * kinds.length)];
    const el = document.createElement("span");
    el.className = "fx " + kind;
    el.style.setProperty("--x", (Math.random() * 94 + 2) + "%");
    el.style.setProperty("--s", (kind === "heart" ? 14 + Math.random() * 22 : 22 + Math.random() * 18) + "px");
    el.style.setProperty("--t", (9 + Math.random() * 8) + "s");
    el.style.setProperty("--dx", (Math.random() * 90 - 45) + "px");
    el.innerHTML = kind === "heart" ? "♥" : '<span class="bf">🦋</span>';
    layer.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  }
  for (let i = 0; i < 5; i++) setTimeout(spawn, i * 400);
  setInterval(spawn, 900);
})();

// ---------- gate ----------
$("form").addEventListener("submit", e => {
  e.preventDefault();
  const clean = s => s.toLowerCase().replace(/[^a-z0-9\u0600-\u06FF]/g, "");
  if (clean($("pw").value) === clean(CONFIG.password)) {
    $("env").classList.add("open");
    setTimeout(() => {
      $("gate").classList.add("hidden");
      $("story").classList.remove("hidden");
      if (CONFIG.music) $("music").classList.remove("hidden");
      playMusic();
      window.scrollTo(0, 0);
    }, 900);
  } else {
    $("err").textContent = "كلمة السر غلط، جرّب تاني.";
    $("pw").classList.remove("shake"); void $("pw").offsetWidth; $("pw").classList.add("shake");
  }
});

// ---------- letter ----------
$("letter").innerHTML = CONFIG.letter.map(t => `<p>${t}</p>`).join("") + `<p class="sign script">${CONFIG.sign}</p>`;

// ---------- gallery ----------
$("gallery").innerHTML = CONFIG.photos.map(p => `
  <figure class="photo">
    <div class="frame"><img src="${p.src}" alt="${p.caption}" loading="lazy"></div>
    <figcaption>${p.caption}</figcaption>
  </figure>`).join("");
document.querySelectorAll(".photo img").forEach(img => {
  img.addEventListener("error", () => {
    img.parentElement.innerHTML = "حط الصورة هنا<br><small dir=\"ltr\">" + img.getAttribute("src") + "</small>";
  });
});

// ---------- videos ----------
const audio = $("audio");
let musicWasOn = false;
if (!CONFIG.videos || !CONFIG.videos.length) {
  $("videosSection").classList.add("hidden");
} else {
  $("videos").innerHTML = CONFIG.videos.map(v => `
    <figure class="vid">
      <video controls playsinline preload="metadata" src="${v.src}"></video>
      ${v.caption ? `<figcaption>${v.caption}</figcaption>` : ""}
    </figure>`).join("");
  document.querySelectorAll(".vid video").forEach(v => {
    v.addEventListener("error", () => {
      const m = document.createElement("div");
      m.className = "miss";
      m.innerHTML = "حط الفيديو هنا<br><small dir=\"ltr\">" + v.getAttribute("src") + "</small>";
      v.replaceWith(m);
    });
    // وقّف الموسيقى وقت تشغيل الفيديو وارجعها بعده
    v.addEventListener("play", () => { musicWasOn = !audio.paused; audio.pause(); });
    const back = () => { if (musicWasOn) audio.play().catch(() => {}); musicWasOn = false; };
    v.addEventListener("pause", back);
    v.addEventListener("ended", back);
  });
}

// ---------- counter ----------
const fmt = start.toLocaleDateString("ar-EG", { day: "numeric", month: "long", year: "numeric" });
$("since").textContent = "من يوم " + fmt + "، وكل ثانية بتعدي بنبسط أكتر إننا سوا";
function tick() {
  let diff = Math.max(0, Math.floor((Date.now() - start) / 1000));
  const d = Math.floor(diff / 86400); diff -= d * 86400;
  const h = Math.floor(diff / 3600); diff -= h * 3600;
  const m = Math.floor(diff / 60), s = diff - m * 60;
  $("d").textContent = d.toLocaleString("ar-EG");
  $("h").textContent = h.toLocaleString("ar-EG");
  $("m").textContent = m.toLocaleString("ar-EG");
  $("s").textContent = s.toLocaleString("ar-EG");
  const now = new Date();
  let y = now.getFullYear() - start.getFullYear();
  const anniv = new Date(now.getFullYear(), start.getMonth(), start.getDate());
  if (now < anniv) y--;
  $("years").textContent = y > 0 ? "عدّى علينا " + y.toLocaleString("ar-EG") + " سنين، وكل سنة أحلى" : "";
}
tick(); setInterval(tick, 1000);

// ---------- timeline ----------
$("timeline").innerHTML = CONFIG.timeline.map(e => `
  <div class="event"><h3>${e.title}</h3>${e.date ? `<time>${e.date}</time>` : ""}<p>${e.text}</p></div>`).join("");

$("foot").textContent = CONFIG.footer;

// ---------- music ----------
function playMusic() {
  if (!CONFIG.music) return;
  audio.src = CONFIG.music;
  audio.play().catch(() => {});
}
$("music").addEventListener("click", () => { audio.paused ? audio.play().catch(() => {}) : audio.pause(); });
</script>
</body>
</html>
